<html lang="ja">
<head>
  <meta charset="UTF-8">

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Favicon / Apple Touch Icon using SVG Data URI -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%230f172a' stroke='%23ff4b4b' stroke-width='4'/%3E%3Cpath d='M35 28 L35 72 L75 50 Z' fill='%23ff4b4b'/%3E%3Ccircle cx='50' cy='50' r='38' fill='none' stroke='%2300f2fe' stroke-dasharray='10 5' stroke-width='3' opacity='0.7'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230b0f19'/%3E%3Ccircle cx='90' cy='90' r='70' fill='none' stroke='url(%23g)' stroke-width='10'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ff3366'/%3E%3Cstop offset='100%25' stop-color='%2300f2fe'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M75 55 L75 125 L130 90 Z' fill='%23ffffff'/%3E%3C/svg%3E">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       CSS VARIABLES & THEME DEFINITIONS
       ========================================================================== */
    :root {
      /* Base Colors */
      --bg-main: #07090e;
      --bg-card: rgba(22, 27, 41, 0.7);
      --bg-card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      /* Phase Colors: Idle / Default */
      --phase-color: #6366f1;
      --phase-color-glow: rgba(99, 102, 241, 0.4);
      --phase-gradient: linear-gradient(135deg, #4f46e5, #06b6d4);
      --phase-bg: radial-gradient(circle at 50% 30%, rgba(99, 102, 241, 0.15) 0%, rgba(7, 9, 14, 0.95) 75%);

      /* Phase Colors: Prepare */
      --color-prepare: #f59e0b;
      --color-prepare-glow: rgba(245, 158, 11, 0.4);
      --gradient-prepare: linear-gradient(135deg, #f59e0b, #fbbf24);

      /* Phase Colors: Work (High Energy Red/Orange) */
      --color-work: #ff385c;
      --color-work-glow: rgba(255, 56, 92, 0.45);
      --gradient-work: linear-gradient(135deg, #ff1744, #ff6b35);

      /* Phase Colors: Rest (Relaxing Blue/Cyan) */
      --color-rest: #00d2ff;
      --color-rest-glow: rgba(0, 210, 255, 0.4);
      --gradient-rest: linear-gradient(135deg, #0099ff, #00f2fe);

      /* Phase Colors: Finished (Victory Gold/Green) */
      --color-finish: #10b981;
      --color-finish-glow: rgba(16, 185, 129, 0.4);
      --gradient-finish: linear-gradient(135deg, #10b981, #34d399);

      /* Radii & Shadows */
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --radius-full: 9999px;
      --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
      --shadow-glow: 0 0 25px var(--phase-color-glow);

      /* Safe areas */
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    /* Phase Dynamic Themes via body dataset */
    body[data-phase="IDLE"] {
      --phase-color: #818cf8;
      --phase-color-glow: rgba(129, 140, 248, 0.35);
      --phase-gradient: linear-gradient(135deg, #6366f1, #3b82f6);
      --phase-bg: radial-gradient(circle at 50% 25%, rgba(99, 102, 241, 0.18) 0%, rgba(7, 9, 14, 0.98) 70%);
    }
    body[data-phase="PREPARE"] {
      --phase-color: var(--color-prepare);
      --phase-color-glow: var(--color-prepare-glow);
      --phase-gradient: var(--gradient-prepare);
      --phase-bg: radial-gradient(circle at 50% 25%, rgba(245, 158, 11, 0.22) 0%, rgba(7, 9, 14, 0.98) 70%);
    }
    body[data-phase="WORK"] {
      --phase-color: var(--color-work);
      --phase-color-glow: var(--color-work-glow);
      --phase-gradient: var(--gradient-work);
      --phase-bg: radial-gradient(circle at 50% 25%, rgba(255, 23, 68, 0.28) 0%, rgba(7, 9, 14, 0.98) 72%);
    }
    body[data-phase="REST"] {
      --phase-color: var(--color-rest);
      --phase-color-glow: var(--color-rest-glow);
      --phase-gradient: var(--gradient-rest);
      --phase-bg: radial-gradient(circle at 50% 25%, rgba(0, 210, 255, 0.24) 0%, rgba(7, 9, 14, 0.98) 70%);
    }
    body[data-phase="FINISHED"] {
      --phase-color: var(--color-finish);
      --phase-color-glow: var(--color-finish-glow);
      --phase-gradient: var(--gradient-finish);
      --phase-bg: radial-gradient(circle at 50% 25%, rgba(16, 185, 129, 0.25) 0%, rgba(7, 9, 14, 0.98) 70%);
    }

    /* ==========================================================================
       RESET & BASE STYLES
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }

    body {
      background-image: var(--phase-bg);
      background-attachment: fixed;
      transition: background-image 0.5s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      padding: calc(var(--sat) + 10px) calc(var(--sar) + 16px) calc(var(--sab) + 14px) calc(var(--sal) + 16px);
    }

    button {
      font-family: inherit;
      border: none;
      background: none;
      color: inherit;
      cursor: pointer;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    button:active {
      transform: scale(0.96);
    }

    input, select {
      font-family: inherit;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--bg-card-border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 15px;
      outline: none;
      user-select: auto;
      -webkit-user-select: auto;
    }
    input:focus, select:focus {
      border-color: var(--phase-color);
      box-shadow: 0 0 0 2px var(--phase-color-glow);
    }

    /* ==========================================================================
       HEADER & TOP CONTROLS
       ========================================================================== */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding-bottom: 6px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background: var(--phase-gradient);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 12px var(--phase-color-glow);
      transition: all 0.4s ease;
    }
    .brand-icon svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }
    .brand-text {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .brand-tag {
      font-size: 9px;
      font-weight: 800;
      color: #000;
      background: var(--phase-color);
      padding: 1px 5px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: background 0.4s ease;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-full);
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      position: relative;
    }
    .icon-btn:hover, .icon-btn.active {
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .icon-btn svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
    }

    /* Wakelock indicator dot */
    .wakelock-dot {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .wakelock-active .wakelock-dot {
      opacity: 1;
    }

    /* ==========================================================================
       PRESET PICKER BAR (HORIZONTAL CHIPS)
       ========================================================================== */
    .preset-section {
      width: 100%;
      max-width: 520px;
      margin: 4px auto 10px;
    }
    .preset-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px 2px;
      -webkit-overflow-scrolling: touch;
    }
    .preset-bar::-webkit-scrollbar {
      display: none;
    }

    .preset-chip {
      flex: 0 0 auto;
      padding: 7px 14px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--bg-card-border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease;
    }
    .preset-chip:hover {
      background: rgba(255, 255, 255, 0.09);
      color: var(--text-main);
    }
    .preset-chip.active {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--phase-color);
      color: var(--text-main);
      box-shadow: 0 0 14px var(--phase-color-glow);
    }
    .preset-chip-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--phase-color);
    }

    .manage-preset-chip {
      padding: 7px 12px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px dashed rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
    }

    /* ==========================================================================
       MAIN TIMER DISPLAY
       ========================================================================== */
    .timer-container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      flex: 1;
      min-height: 290px;
    }

    /* Circular SVG Gauge */
    .gauge-wrapper {
      position: relative;
      width: min(72vw, 310px);
      height: min(72vw, 310px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gauge-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      overflow: visible;
      filter: drop-shadow(0 0 18px var(--phase-color-glow));
      transition: filter 0.4s ease;
    }

    .gauge-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.06);
      stroke-width: 8;
    }

    .gauge-progress {
      fill: none;
      stroke: var(--phase-color);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 816.8; /* 2 * PI * 130 */
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.15s linear, stroke 0.4s ease;
    }

    /* Center Content Inside Gauge */
    .gauge-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      text-align: center;
      pointer-events: none;
    }

    .phase-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ffffff;
      background: var(--phase-color);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      box-shadow: 0 2px 10px var(--phase-color-glow);
      margin-bottom: 6px;
      transition: all 0.3s ease;
      transform-origin: center;
    }
    .phase-badge.pulse {
      animation: badgePulse 1.2s infinite ease-in-out;
    }
    @keyframes badgePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Giant Digital Timer */
    .digital-timer {
      font-family: 'Chakra Petch', monospace, sans-serif;
      font-size: min(19vw, 82px);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -2px;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      margin: 4px 0 6px;
      font-variant-numeric: tabular-nums;
    }

    /* Sub information (Sets & Next Phase) */
    .set-counter {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.3);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .set-counter strong {
      color: var(--text-main);
      font-size: 15px;
    }

    .next-phase-info {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      margin-top: 6px;
      min-height: 18px;
    }
    .next-phase-info span {
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Total Stats Footer Bar */
    .timer-stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      border-radius: var(--radius-md);
      padding: 10px 16px;
      margin-top: 14px;
      box-shadow: var(--shadow-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .stat-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .stat-value {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }
    .stat-divider {
      width: 1px;
      height: 24px;
      background: var(--bg-card-border);
    }

    /* ==========================================================================
       QUICK ADJUSTERS (IN-WORK/REST JUMP)
       ========================================================================== */
    .quick-adjust-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 8px 0;
      width: 100%;
      max-width: 520px;
    }
    .adjust-btn {
      padding: 6px 12px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--bg-card-border);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .adjust-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    /* ==========================================================================
       MAIN CONTROLS (BOTTOM ACTION BUTTONS)
       ========================================================================== */
    .controls-container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      align-items: center;
      gap: 12px;
      padding-top: 8px;
    }

    .ctrl-side-btn {
      height: 56px;
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: var(--shadow-glass);
      backdrop-filter: blur(10px);
    }
    .ctrl-side-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.08);
    }
    .ctrl-side-btn svg {
      width: 20px;
      height: 20px;
    }

    .ctrl-main-btn {
      height: 64px;
      border-radius: var(--radius-lg);
      background: var(--phase-gradient);
      color: #ffffff;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 25px var(--phase-color-glow);
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .ctrl-main-btn::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(255, 255, 255, 0.2), transparent);
      pointer-events: none;
    }
    .ctrl-main-btn:active {
      transform: scale(0.97);
      box-shadow: 0 4px 15px var(--phase-color-glow);
    }
    .ctrl-main-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    /* ==========================================================================
       MODALS & DIALOGS (SETTINGS, PRESET MANAGER, VICTORY)
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 520px;
      background: #111624;
      border: 1px solid var(--bg-card-border);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: 22px 20px calc(var(--sab) + 24px);
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.7);
    }
    .modal-backdrop.open .modal-card {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .form-hint {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: normal;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .form-row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .time-picker-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--bg-card-border);
      border-radius: var(--radius-sm);
      padding: 4px 10px;
      gap: 6px;
    }
    .time-picker-box input {
      border: none;
      background: transparent;
      padding: 6px 0;
      font-size: 18px;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      text-align: center;
      width: 100%;
    }
    .time-picker-unit {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-dim);
    }

    .stepper-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--bg-card-border);
      border-radius: var(--radius-sm);
      padding: 4px;
    }
    .step-btn {
      width: 38px;
      height: 38px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);

  <!-- ==========================================================================
       JAVASCRIPT LOGIC

  <script>
    /* ==========================================================================
       1. WEB AUDIO API SYNTHESIZER (No external audio files needed!)
       ========================================================================== */
    class SoundController {
      constructor() {
        this.ctx = null;
        this.soundEnabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Short beep for countdown (3, 2, 1)
      playCountdownBeep() {
        if (!this.soundEnabled) return;
        this.init();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime); // 800Hz
        
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);

        // Mobile vibration if supported
        if (navigator.vibrate) navigator.vibrate(60);
      }

      // Stronger whistle / high beep for phase switch (WORK or REST start)
      playPhaseSwitchSound(isWork = true) {
        if (!this.soundEnabled) return;
        this.init();
        if (!this.ctx) return;

        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        const startFreq = isWork ? 659.25 : 880; // E5 or A5
        const endFreq = isWork ? 1318.51 : 1760; // E6 or A6

        osc.frequency.setValueAtTime(startFreq, t);
        osc.frequency.exponentialRampToValueAtTime(endFreq, t + 0.12);

        gain.gain.setValueAtTime(0.5, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(t + 0.45);

        if (navigator.vibrate) navigator.vibrate([120, 80, 200]);
      }

      // Fanfare for complete
      playVictorySound() {
        if (!this.soundEnabled) return;
        this.init();
        if (!this.ctx) return;

        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const t = this.ctx.currentTime + idx * 0.14;

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);

          gain.gain.setValueAtTime(0.4, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + (idx === notes.length - 1 ? 0.6 : 0.25));

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(t);
          osc.stop(t + (idx === notes.length - 1 ? 0.6 : 0.25));
        });

        if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 300]);
      }
    }

    /* ==========================================================================
       2. WAKELOCK CONTROLLER (Prevent Screen Sleep)
       ========================================================================== */
    class WakeLockController {
      constructor(onStateChange) {
        this.wakeLock = null;
        this.isActive = false;
        this.onStateChange = onStateChange;

        // Auto re-acquire when returning to tab
        document.addEventListener('visibilitychange', () => {
          if (this.isActive && document.visibilityState === 'visible') {
            this.requestLock();
          }
        });
      }

      async requestLock() {
        if ('wakeLock' in navigator) {
          try {
            this.wakeLock = await navigator.wakeLock.request('screen');
            this.isActive = true;
            this.wakeLock.addEventListener('release', () => {
              if (this.isActive) {
                // Was released externally, re-request if we are still active
                this.requestLock();
              }
            });
            if (this.onStateChange) this.onStateChange(true);
          } catch (err) {
            console.log('WakeLock error:', err);
            this.isActive = false;
            if (this.onStateChange) this.onStateChange(false);
          }
        } else {
          // WakeLock not supported
          if (this.onStateChange) this.onStateChange(false);
        }
      }

      releaseLock() {
        this.isActive = false;
        if (this.wakeLock) {
          this.wakeLock.release().catch(() => {});
          this.wakeLock = null;
        }
        if (this.onStateChange) this.onStateChange(false);
      }
    }

    /* ==========================================================================
       3. PRESET STORAGE MANAGER (LocalStorage with Defaults)
       ========================================================================== */
    const STORAGE_KEY_PRESETS = 'fit_timer_presets_v1';
    const STORAGE_KEY_ACTIVE_ID = 'fit_timer_active_preset_id';

    const DEFAULT_PRESETS = [
      {
        id: 'tabata',
        name: 'HIIT (タバタ式)',
        workSec: 20,
        restSec: 10,
        sets: 8,
        prepSec: 5,
        isDefault: true
      },
      {
        id: 'abs_circuit',
        name: '体幹・腹筋サーキット',
        workSec: 30,
        restSec: 15,
        sets: 6,
        prepSec: 5,
        isDefault: true
      },
      {
        id: 'strength',
        name: '筋トレ標準 (45s/60s)',
        workSec: 45,
        restSec: 60,
        sets: 4,
        prepSec: 5,
        isDefault: true
      },
      {
        id: 'quick_stretch',
        name: 'クイックストレッチ',
        workSec: 40,
        restSec: 10,
        sets: 5,
        prepSec: 3,
        isDefault: true
      }
    ];

    class PresetManager {
      constructor() {
        this.presets = this.loadPresets();
        this.activePresetId = localStorage.getItem(STORAGE_KEY_ACTIVE_ID) || this.presets[0].id;
      }

      loadPresets() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY_PRESETS);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              return parsed;
            }
          }
        } catch (e) {
          console.error('Failed to parse stored presets', e);
        }
        this.savePresets(DEFAULT_PRESETS);
        return [...DEFAULT_PRESETS];
      }

      savePresets(presets) {
        this.presets = presets;
        localStorage.setItem(STORAGE_KEY_PRESETS, JSON.stringify(presets));
      }

      getActivePreset() {
        const found = this.presets.find(p => p.id === this.activePresetId);
        return found || this.presets[0];
      }

      setActivePreset(id) {
        this.activePresetId = id;
        localStorage.setItem(STORAGE_KEY_ACTIVE_ID, id);
      }

      addOrUpdatePreset(preset) {
        const idx = this.presets.findIndex(p => p.id === preset.id);
        if (idx >= 0) {
          this.presets[idx] = preset;
        } else {
          this.presets.push(preset);
        }
        this.savePresets(this.presets);
        this.setActivePreset(preset.id);
      }

      deletePreset(id) {
        if (this.presets.length <= 1) {
          alert('少なくとも1つのメニューを残してください。');
          return false;
        }
        this.presets = this.presets.filter(p => p.id !== id);
        this.savePresets(this.presets);
        if (this.activePresetId === id) {
          this.setActivePreset(this.presets[0].id);
        }
        return true;
      }
    }

    /* ==========================================================================
       4. TIMER ENGINE & APP CONTROLLER
       ========================================================================== */
    const PHASES = {
      IDLE: 'IDLE',
      PREPARE: 'PREPARE',
      WORK: 'WORK',
      REST: 'REST',
      FINISHED: 'FINISHED'
    };

    class IntervalTimerApp {

      bindEvents() {

        this.plus5SecBtn.addEventListener('click', () => this.adjustPhaseTime(5));

        this.wakeLockBtn.addEventListener('click', () => {

          }

        this.cancelFormBtn.addEventListener('click', () => this.hideForm());
        this.savePresetBtn.addEventListener('click', () => this.handleSavePreset());

        this.setMinusBtn.addEventListener('click', () => {

          }

      /* --------------------------------------------------------------------------
         Preset Application & Switching
         -------------------------------------------------------------------------- */
      applyPreset(preset) {
        this.currentPreset = preset;
        this.presetMgr.setActivePreset(preset.id);

        this.currentSet = 1;
        this.phase = PHASES.IDLE;
        this.isRunning = false;
        clearInterval(this.timerInterval);

        // Calculate initial work duration
        this.phaseRemainingSec = preset.workSec;
        this.phaseTotalDuration = preset.workSec;

        this.updateThemeAndBadge();
        this.updateDisplay();
        this.updateStats();
        this.updateMainButtonState();
        this.renderPresetChips();
      }

      renderPresetChips() {
        const presets = this.presetMgr.presets;
        const activeId = this.presetMgr.activePresetId;

        this.presetChipsContainer.innerHTML = '';
        presets.forEach(p => {
          const chip = document.createElement('button');
          chip.className = `preset-chip ${p.id === activeId ? 'active' : ''}`;
          chip.innerHTML = `
            <span class="preset-chip-dot"></span>
            <span>${this.escapeHtml(p.name)}</span>
          `;
          chip.addEventListener('click', () => {
            if (this.isRunning) {
              if (!confirm('タイマー実行中です。メニューを切り替えますか？')) return;
            }
            this.applyPreset(p);
            this.showToast(`「${p.name}」をセットしました`);
          });
          this.presetChipsContainer.appendChild(chip);
        });

        // Add "+ 追加/管理" chip at the end
        const manageChip = document.createElement('button');
        manageChip.className = 'preset-chip manage-preset-chip';
        manageChip.innerHTML = `<span>⚙️ メニュー管理</span>`;
        manageChip.addEventListener('click', () => this.openPresetsModal());
        this.presetChipsContainer.appendChild(manageChip);
      }

      /* --------------------------------------------------------------------------
         Timer Execution Engine
         -------------------------------------------------------------------------- */
      toggleStartPause() {
        this.sound.init();

        if (this.isRunning) {
          this.pauseTimer();
        } else {
          this.startTimer();
        }
      }

      startTimer() {
        if (this.phase === PHASES.IDLE || this.phase === PHASES.FINISHED) {
          // Check if there is prep time
          if (this.currentPreset.prepSec > 0) {
            this.phase = PHASES.PREPARE;
            this.phaseRemainingSec = this.currentPreset.prepSec;
            this.phaseTotalDuration = this.currentPreset.prepSec;
          } else {
            this.phase = PHASES.WORK;
            this.phaseRemainingSec = this.currentPreset.workSec;
            this.phaseTotalDuration = this.currentPreset.workSec;
            this.sound.playPhaseSwitchSound(true);
          }
          this.currentSet = 1;
        }

        this.isRunning = true;
        this.lastTimestamp = performance.now();
        this.accumulatedMs = 0;

        // Auto request wakeLock
        this.wakeLock.requestLock();

        this.updateThemeAndBadge();
        this.updateMainButtonState();
        this.updateDisplay();

        clearInterval(this.timerInterval);
        this.timerInterval = setInterval(() => this.tick(), 100);
      }

      pauseTimer() {
        this.isRunning = false;
        clearInterval(this.timerInterval);
        this.updateMainButtonState();
        this.phaseBadge.classList.add('pulse');
      }

      resetTimer() {
        this.isRunning = false;
        clearInterval(this.timerInterval);
        this.phase = PHASES.IDLE;
        this.currentSet = 1;
        this.phaseRemainingSec = this.currentPreset.workSec;
        this.phaseTotalDuration = this.currentPreset.workSec;

        this.updateThemeAndBadge();
        this.updateDisplay();
        this.updateStats();
        this.updateMainButtonState();
      }

      tick() {
        if (!this.isRunning) return;

        const now = performance.now();
        const delta = now - this.lastTimestamp;
        this.lastTimestamp = now;

        this.accumulatedMs += delta;

        // Advance seconds
        while (this.accumulatedMs >= 1000) {
          this.accumulatedMs -= 1000;
          this.phaseRemainingSec -= 1;

          // Sound triggers for last 3 seconds
          if (this.phaseRemainingSec > 0 && this.phaseRemainingSec <= 3) {
            this.sound.playCountdownBeep();
          }

          if (this.phaseRemainingSec <= 0) {
            this.advanceToNextPhase();
            break;
          }
        }

        this.updateDisplay();
        this.updateStats();
      }

      advanceToNextPhase() {
        if (this.phase === PHASES.PREPARE) {
          // Prepare -> Work Set 1
          this.phase = PHASES.WORK;
          this.phaseRemainingSec = this.currentPreset.workSec;
          this.phaseTotalDuration = this.currentPreset.workSec;
          this.sound.playPhaseSwitchSound(true);
        } else if (this.phase === PHASES.WORK) {
          // Work -> Rest (or Finished if last set and rest is skipped/not applicable)
          if (this.currentSet >= this.currentPreset.sets) {
            this.finishWorkout();
            return;
          } else {
            this.phase = PHASES.REST;
            this.phaseRemainingSec = this.currentPreset.restSec;
            this.phaseTotalDuration = this.currentPreset.restSec;
            this.sound.playPhaseSwitchSound(false);
          }
        } else if (this.phase === PHASES.REST) {
          // Rest -> Next Work Set
          this.currentSet += 1;
          this.phase = PHASES.WORK;
          this.phaseRemainingSec = this.currentPreset.workSec;
          this.phaseTotalDuration = this.currentPreset.workSec;
          this.sound.playPhaseSwitchSound(true);
        }

        this.updateThemeAndBadge();
      }

      skipCurrentPhase() {
        if (this.phase === PHASES.IDLE || this.phase === PHASES.FINISHED) return;
        this.advanceToNextPhase();
        this.updateDisplay();
        this.updateStats();
        this.showToast('フェーズをスキップしました');
      }

      adjustPhaseTime(seconds) {
        if (this.phase === PHASES.IDLE || this.phase === PHASES.FINISHED) return;
        this.phaseRemainingSec = Math.max(1, this.phaseRemainingSec + seconds);
        this.phaseTotalDuration = Math.max(this.phaseRemainingSec, this.phaseTotalDuration);
        this.updateDisplay();
        this.updateStats();
        this.showToast(`${seconds > 0 ? '+' : ''}${seconds}秒 調整しました`);
      }

      finishWorkout() {
        this.isRunning = false;
        clearInterval(this.timerInterval);
        this.phase = PHASES.FINISHED;
        this.phaseRemainingSec = 0;

        this.sound.playVictorySound();
        this.updateThemeAndBadge();
        this.updateDisplay();
        this.updateStats();
        this.updateMainButtonState();

        // Show Victory Modal
        this.victoryPresetName.textContent = this.currentPreset.name;
        this.victorySets.textContent = `${this.currentPreset.sets} / ${this.currentPreset.sets}`;
        this.victoryTotalTime.textContent = this.formatTimeMinSec(this.calculateTotalWorkoutTime(this.currentPreset));
        this.victoryModal.classList.add('open');
      }

      /* --------------------------------------------------------------------------
         UI Updates & Rendering
         -------------------------------------------------------------------------- */
      updateThemeAndBadge() {
        this.body.setAttribute('data-phase', this.phase);

        let badgeText = 'READY';
        if (this.phase === PHASES.PREPARE) badgeText = '⏳ 準備 (GET READY)';
        else if (this.phase === PHASES.WORK) badgeText = '🔥 トレーニング (WORK)';
        else if (this.phase === PHASES.REST) badgeText = '💤 インターバル (REST)';
        else if (this.phase === PHASES.FINISHED) badgeText = '🏆 COMPLETE!';

        this.phaseBadge.textContent = badgeText;
        if (this.isRunning) {
          this.phaseBadge.classList.remove('pulse');
        } else {
          this.phaseBadge.classList.add('pulse');
        }
      }

      updateDisplay() {
        // Digital clock text (MM:SS)
        this.digitalTimer.textContent = this.formatTimeMinSec(this.phaseRemainingSec);

        // Circular progress gauge
        // Circumference: 2 * PI * 130 = 816.814
        const circumference = 816.814;
        let progress = 1;
        if (this.phaseTotalDuration > 0) {
          progress = Math.max(0, Math.min(1, this.phaseRemainingSec / this.phaseTotalDuration));
        }
        const offset = circumference * (1 - progress);
        this.gaugeProgress.style.strokeDashoffset = offset;

        // Set indicator
        this.setIndicator.textContent = `${this.currentSet} / ${this.currentPreset.sets}`;

        // Next phase preview
        if (this.phase === PHASES.PREPARE) {
          this.nextPhaseInfo.innerHTML = `次: <span>WORK ${this.formatTimeMinSec(this.currentPreset.workSec)}</span>`;
        } else if (this.phase === PHASES.WORK) {
          if (this.currentSet >= this.currentPreset.sets) {
            this.nextPhaseInfo.innerHTML = `次: <span>ゴール！ (全セット完了)</span>`;
          } else {
            this.nextPhaseInfo.innerHTML = `次: <span>REST ${this.formatTimeMinSec(this.currentPreset.restSec)}</span>`;
          }
        } else if (this.phase === PHASES.REST) {
          this.nextPhaseInfo.innerHTML = `次: <span>SET ${this.currentSet + 1} (${this.formatTimeMinSec(this.currentPreset.workSec)})</span>`;
        } else {
          this.nextPhaseInfo.innerHTML = `全 ${this.currentPreset.sets} セット (${this.formatTimeMinSec(this.currentPreset.workSec)} ワーク / ${this.formatTimeMinSec(this.currentPreset.restSec)} 休憩)`;
        }
      }

      updateStats() {
        this.statPresetName.textContent = this.currentPreset.name;

        // Total remaining time in workout
        const totalOverall = this.calculateTotalWorkoutTime(this.currentPreset);
        const remainingOverall = this.calculateRemainingTotalTime();

        this.statRemainingTotal.textContent = this.formatTimeMinSec(remainingOverall);
        this.statOverallTotal.textContent = this.formatTimeMinSec(totalOverall);
      }

      calculateTotalWorkoutTime(p) {
        const prep = p.prepSec || 0;
        const workTotal = p.workSec * p.sets;
        const restTotal = p.restSec * Math.max(0, p.sets - 1);
        return prep + workTotal + restTotal;
      }

      calculateRemainingTotalTime() {
        if (this.phase === PHASES.FINISHED) return 0;
        if (this.phase === PHASES.IDLE) return this.calculateTotalWorkoutTime(this.currentPreset);

        let rem = this.phaseRemainingSec;
        const p = this.currentPreset;

        if (this.phase === PHASES.PREPARE) {
          // remaining prep + all work + all rest
          return rem + (p.workSec * p.sets) + (p.restSec * Math.max(0, p.sets - 1));
        }

        const remainingSets = p.sets - this.currentSet;
        if (this.phase === PHASES.WORK) {
          // remaining this work + (remainingSets * work) + (remainingSets * rest)
          return rem + (remainingSets * p.workSec) + (remainingSets * p.restSec);
        } else if (this.phase === PHASES.REST) {
          // remaining this rest + (remainingSets * work) + ((remainingSets - 1) * rest)
          return rem + (remainingSets * p.workSec) + (Math.max(0, remainingSets - 1) * p.restSec);
        }

        return rem;
      }

      updateMainButtonState() {
        if (this.isRunning) {
          this.playIcon.style.display = 'none';
          this.pauseIcon.style.display = 'block';
          this.mainBtnText.textContent = 'PAUSE';
          this.mainToggleBtn.style.filter = 'brightness(1.1)';
        } else {
          this.playIcon.style.display = 'block';
          this.pauseIcon.style.display = 'none';
          this.mainBtnText.textContent = this.phase === PHASES.IDLE ? 'START' : 'RESUME';
          this.mainToggleBtn.style.filter = 'none';
        }
      }

      updateWakeLockUI(active) {
        if (active) {
          this.wakeLockBtn.classList.add('wakelock-active');
        } else {
          this.wakeLockBtn.classList.remove('wakelock-active');
        }
      }

      toggleSound() {
        this.sound.soundEnabled = !this.sound.soundEnabled;
        if (this.sound.soundEnabled) {
          this.soundIconOn.style.display = 'block';
          this.soundIconOff.style.display = 'none';
          this.soundToggleBtn.classList.add('active');
          this.showToast('サウンド: ON 🔊');
          this.sound.playCountdownBeep();
        } else {
          this.soundIconOn.style.display = 'none';
          this.soundIconOff.style.display = 'block';
          this.soundToggleBtn.classList.remove('active');
          this.showToast('サウンド: OFF 🔇');
        }
      }

      /* --------------------------------------------------------------------------
         Modal & Presets CRUD
         -------------------------------------------------------------------------- */
      openPresetsModal() {
        this.renderModalPresetsList();
        this.hideForm();
        this.presetsModal.classList.add('open');
      }

      closePresetsModal() {
        this.presetsModal.classList.remove('open');
      }

      renderModalPresetsList() {
        const presets = this.presetMgr.presets;
        const activeId = this.presetMgr.activePresetId;

        this.modalPresetList.innerHTML = '';
        presets.forEach(p => {
          const item = document.createElement('div');
          item.className = `preset-item ${p.id === activeId ? 'active' : ''}`;
          item.innerHTML = `
            <div class="preset-item-info">

                🔥 ${this.formatTimeMinSec(p.workSec)} / 💤 ${this.formatTimeMinSec(p.restSec)} × ${p.sets}セット
                ${p.prepSec ? `(準備 ${p.prepSec}s)` : ''}
              </div>
            </div>
            <div class="preset-item-actions">
              <button class="preset-action-btn edit-btn" title="編集">✏️</button>
              ${presets.length > 1 ? `<button class="preset-action-btn delete delete-btn" title="削除">🗑️</button>` : ''}
            </div>
          `;

          // Select on info click
          item.querySelector('.preset-item-info').addEventListener('click', () => {
            this.applyPreset(p);

          });

          if (delBtn) {
            delBtn.addEventListener('click', (e) => {

                this.presetMgr.deletePreset(p.id);
                this.renderModalPresetsList();
                this.renderPresetChips();
                this.applyPreset(this.presetMgr.getActivePreset());
                this.showToast('削除しました');
              }
            });

          this.modalPresetList.appendChild(item);
        });
      }

      openCreateForm() {
        this.editingPresetId = null;
        this.formTitle.textContent = '新規メニュー作成';
        this.inputPresetName.value = '';
        this.inputWorkMin.value = 0;
        this.inputWorkSec.value = 30;
        this.inputRestMin.value = 0;
        this.inputRestSec.value = 15;
        this.formSets = 5;
        this.formPrepSec = 5;
        this.inputSetsDisplay.textContent = '5';
        this.inputPrepDisplay.textContent = '5秒';

        this.presetFormContainer.style.display = 'block';

        this.presetFormContainer.scrollIntoView({ behavior: 'smooth' });

      openEditPreset(p) {
        this.editingPresetId = p.id;
        this.formTitle.textContent = `メニュー編集: ${p.name}`;
        this.inputPresetName.value = p.name;
        
        this.inputWorkMin.value = Math.floor(p.workSec / 60);
        this.inputWorkSec.value = p.workSec % 60;
        this.inputRestMin.value = Math.floor(p.restSec / 60);
        this.inputRestSec.value = p.restSec % 60;

        this.formSets = p.sets;
        this.formPrepSec = p.prepSec || 5;
        this.inputSetsDisplay.textContent = this.formSets;
        this.inputPrepDisplay.textContent = this.formPrepSec + '秒';

        this.presetFormContainer.style.display = 'block';
        this.toggleCreateFormBtn.style.display = 'none';
        this.presetFormContainer.scrollIntoView({ behavior: 'smooth' });
      }

      openEditCurrentPreset() {
        this.openPresetsModal();
        this.openEditPreset(this.currentPreset);
      }

      hideForm() {
        this.presetFormContainer.style.display = 'none';
        this.toggleCreateFormBtn.style.display = 'flex';
      }

      handleSavePreset() {
        const name = this.inputPresetName.value.trim() || 'カスタムメニュー';
        const workMin = parseInt(this.inputWorkMin.value, 10) || 0;
        const workSec = parseInt(this.inputWorkSec.value, 10) || 0;
        const totalWork = (workMin * 60) + workSec;

        const restMin = parseInt(this.inputRestMin.value, 10) || 0;
        const restSec = parseInt(this.inputRestSec.value, 10) || 0;
        const totalRest = (restMin * 60) + restSec;

        if (totalWork <= 0) {
          alert('トレーニング時間は1秒以上に設定してください。');
          return;
        }

        const id = this.editingPresetId || ('preset_' + Date.now());
        const newPreset = {
          id: id,
          name: name,
          workSec: totalWork,
          restSec: totalRest,
          sets: this.formSets,
          prepSec: this.formPrepSec
        };

        this.presetMgr.addOrUpdatePreset(newPreset);
        this.applyPreset(newPreset);
        this.renderPresetChips();
        this.closePresetsModal();
        this.showToast(`「${name}」を保存しました！`);
      }

      /* --------------------------------------------------------------------------
         Utilities
         -------------------------------------------------------------------------- */
      formatTimeMinSec(sec) {
        const s = Math.max(0, Math.floor(sec));
        const m = Math.floor(s / 60);
        const remS = s % 60;
        return `${String(m).padStart(2, '0')}:${String(remS).padStart(2, '0')}`;
      }

      escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      showToast(msg) {
        this.toast.textContent = msg;
        this.toast.classList.add('show');
        clearTimeout(this.toastTimeout);
        this.toastTimeout = setTimeout(() => {
          this.toast.classList.remove('show');
        }, 2200);
      }
    }

    // Initialize application on DOM ready
    document.addEventListener('DOMContentLoaded', () => {
      window.fitTimerApp = new IntervalTimerApp();

      // Register Service Worker for offline PWA support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((reg) => {
            console.log('FIT TIMER PRO ServiceWorker registered:', reg.scope);
          }).catch((err) => {
            console.log('ServiceWorker registration skipped/failed:', err);
          });
        });
      }
    });
  </script>
</body>
</html>
